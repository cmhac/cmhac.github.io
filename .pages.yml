media:
  - name: images
    label: Images
    input: public/media
    output: /media
    categories: [image]
    extensions: [jpg, jpeg, png, webp]

content:
  - name: site
    label: Site Settings
    path: src/config/site.json
    type: file
    fields:
      - name: title
        label: Site Title
        type: string
        required: true
      - name: description
        label: Site Description
        type: string
        required: true
      - name: author
        label: Author Name
        type: string
        required: true
      - name: bio
        label: Homepage Bio
        type: text
        description: One paragraph shown under the name on the homepage.
        required: true
      - name: location
        label: Footer Location
        type: string
        required: true
      - name: updatedLabel
        label: Footer "Updated" Label
        type: string
        required: true
      - name: socialLinks
        label: Contact Links
        type: object
        fields:
          - name: washingtonPost
            label: Washington Post Byline URL
            type: string
          - name: github
            label: GitHub URL
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
          - name: bluesky
            label: Bluesky URL
            type: string

  - name: projects
    label: Reporting & Tools
    path: src/content/projects
    type: collection
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: note
        label: One-line Description
        description: Shown on the index list and under the title on the detail page.
        type: string
        required: true
      - name: kind
        label: Section
        type: select
        options:
          values: ["Reporting and analysis", "Tools and infrastructure"]
        required: true
      - name: order
        label: Order
        description: Position within its section, lowest first.
        type: number
        required: true
      - name: url
        label: Published URL
        type: string
        required: false
      - name: cover
        label: Cover Image
        description: 16:9. Leave blank to omit the cover image on the detail page.
        type: image
        required: false
      - name: body
        label: Body
        type: rich-text
        required: true

  - name: experience
    label: Experience
    path: src/content/experience
    type: collection
    fields:
      - name: order
        label: Order
        type: number
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: org
        label: Org / Location
        type: string
        required: true
      - name: dates
        label: Dates
        type: string
        required: true
      - name: roles
        label: Nested Roles
        description: Only used for an employer with more than one role (e.g. WBBM).
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: dates
            label: Dates
            type: string
