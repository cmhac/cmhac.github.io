media:
  - name: images
    label: Images
    input: public/media
    output: /media
    categories: [image]
    extensions: [jpg, jpeg, png, webp]

content:
  - name: site
    label: Site Settings
    path: src/config/site.json
    type: file
    fields:
      - name: title
        label: Site Title
        type: string
        required: true
      - name: description
        label: Site Description
        type: string
        required: true
      - name: author
        label: Author Name
        type: string
        required: true
      - name: bio
        label: Homepage Bio
        type: text
        description: One paragraph shown under the name on the homepage.
        required: true
      - name: location
        label: Footer Location
        type: string
        required: true
      - name: updatedLabel
        label: Footer "Updated" Label
        type: string
        required: true
      - name: socialLinks
        label: Contact Links
        type: object
        fields:
          - name: washingtonPost
            label: Washington Post Byline URL
            type: string
          - name: github
            label: GitHub URL
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
          - name: bluesky
            label: Bluesky URL
            type: string

  - name: projects
    label: Reporting & Tools
    path: src/content/projects
    type: collection
    # Without this, Pages CMS defaults to "{year}-{month}-{day}-{primary}.md" and
    # the date prefix would end up in the URL, since the slug is the filename.
    filename: "{fields.title}.md"
    view:
      fields: [title, kind, date]
      sort: [date, title, kind]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: description
        label: Project Description
        description: Shown on the homepage list and under the title on the detail page.
        type: text
        required: true
      - name: kind
        label: Section
        description: Which homepage section this appears under.
        type: select
        options:
          values: ["Reporting and analysis", "Tools and infrastructure"]
        required: true
      - name: technologies
        label: Technologies Used
        type: string
        list: true
      - name: url
        label: Project URL
        type: string
        required: false
      - name: image
        label: Project Image
        description: 16:9. Leave blank to omit the image on the detail page.
        type: image
        required: false
      - name: featured
        label: Featured Project
        type: boolean
        default: false
      - name: date
        label: Project Date
        description: Sorts the list within each section, newest first.
        type: date
      - name: body
        label: Content
        type: rich-text

  - name: experience
    label: Experience
    path: src/content/experience
    type: collection
    filename: "{fields.title}.md"
    view:
      fields: [title, org, dates, order]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: order
        label: Order
        description: Position in the list, lowest first (most recent job at the top).
        type: number
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: org
        label: Org / Location
        type: string
        required: true
      - name: dates
        label: Dates
        type: string
        required: true
      - name: roles
        label: Nested Roles
        description: Only used for an employer with more than one role (e.g. WBBM).
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: dates
            label: Dates
            type: string
